openapi: 3.0.3
info:
  title: Example API
  version: 1.0.0
paths:
  /api/v1/orders:
    get:
      operationId: listOrders
      summary: Returns orders created after the given cursor
      parameters:
        - name: cursor
          in: query
          description: Opaque pagination cursor from the previous page's meta
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: A page of orders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderPage" }
        "422":
          description: Invalid values
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
        "500":
          description: Unexpected server failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }
components:
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string, description: Stable machine-readable error code }
    OrderPage:
      type: object
      required: [items, has_more]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Order" } }
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }
    Order:
      type: object
      required: [id, status, total_cents, currency, created_at]
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, paid, shipped, cancelled] }
        total_cents: { type: integer, minimum: 0, description: Total in minor units }
        currency: { type: string, example: USD }
        created_at: { type: string, format: date-time }
