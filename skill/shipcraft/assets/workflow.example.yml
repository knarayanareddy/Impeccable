# The canonical boring workflow (pipeline command's starting shape).
name: ci
on: [push, pull_request]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true   # stale runs cancel — the pipeline's own noise budget
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: ".nvmrc" }   # toolchain pinned
      - run: npm ci                              # lockfile discipline
      - run: npm run lint
      - run: npm test                            # gates block: no masks, no retries
      - run: npm run build
      - run: docker build -t app@sha256:abc123 . # digest-pinned, immutable
      - run: ./bin/deploy.sh                     # health-checked; rollback armed
        env:
          PROD_KEY: ${{ secrets.PROD_KEY }}      # referenced, never echoed
  rollback:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - run: ./bin/rollback.sh                   # revert to previous image digest
