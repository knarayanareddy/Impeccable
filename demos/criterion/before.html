<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpsBoard — before (generic AI dashboard)</title>
<style>
  /* Inter as a silent default, pure black, gray-on-tinted, huge radius,
     elastic easing, transition:all — the tells, all in one page */
  body { font-family: Inter, sans-serif; background: #f5f6f8; color: #000; margin: 0; }
  header {
    background: linear-gradient(135deg, #6366f1, #3b82f6);
    color: #fff; padding: 28px 32px;
    border-radius: 16px; margin: 24px;
    transition: all 600ms cubic-bezier(0.68, -0.55, 0.265, 1.55);
  }
  header h1 { margin: 0; font-size: 22px; }
  header p { color: #dbeafe; }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin: 0 24px; }
  .card {
    background: #fff; border-radius: 16px; padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .card .kpi { font-size: 30px; font-weight: 700; }
  .card .label { color: #9ca3af; font-size: 13px; }
  .table-wrap { background: #fff; border-radius: 16px; margin: 24px; padding: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: #000; padding: 10px; border-bottom: 1px solid #eee; }
  td { padding: 10px; border-bottom: 1px solid #f0f0f0; }
  .badge { background: #dbeafe; color: #9ca3af; border-radius: 999px; padding: 3px 10px; font-size: 12px; }
  .cta {
    background: #6366f1; color: #fff; border: 0; border-radius: 16px;
    padding: 12px 24px; font-size: 14px; margin: 0 24px 32px;
    transition: all 600ms cubic-bezier(0.68, -0.55, 0.265, 1.55);
  }
  img.hero { width: 100%; border-radius: 16px; }
</style>
</head>
<body>
  <header>
    <h1>OpsBoard</h1>
    <p>Your operations, supercharged.</p>
  </header>
  <div class="grid">
    <div class="card"><div class="kpi">1,284</div><div class="label">Open tickets</div></div>
    <div class="card"><div class="kpi">96.2%</div><div class="label">SLA met</div></div>
    <div class="card"><div class="kpi">$42,900</div><div class="label">Revenue today</div></div>
  </div>
  <div class="table-wrap">
    <svg class="hero" viewBox="0 0 800 160" role="img" aria-label="Ticket volume, last 30 days" style="width:100%;height:160px;border-radius:16px;">
      <rect width="800" height="160" fill="#eef2ff"/>
      <rect x="40" y="80" width="90" height="60" fill="#6366f1"/>
      <rect x="150" y="50" width="90" height="90" fill="#3b82f6"/>
      <rect x="260" y="65" width="90" height="75" fill="#6366f1"/>
      <rect x="370" y="30" width="90" height="110" fill="#3b82f6"/>
      <rect x="480" y="55" width="90" height="85" fill="#6366f1"/>
    </svg>
    <table>
      <tr><th>Ticket</th><th>Owner</th><th>Status</th><th>Age</th></tr>
      <tr><td>#4821</td><td>Ana</td><td><span class="badge">open</span></td><td>2d</td></tr>
      <tr><td>#4820</td><td>Bo</td><td><span class="badge">open</span></td><td>3d</td></tr>
      <tr><td>#4819</td><td>Cem</td><td><span class="badge">closed</span></td><td>12d</td></tr>
    </table>
  </div>
  <button class="cta">View all tickets</button>
</body>
</html>
